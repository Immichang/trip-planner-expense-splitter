<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Planner & Expense Splitter</title>
<style>
:root{
  --primary:#2563eb;
  --secondary:#10b981;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#1e293b;
  --muted:#64748b;
  --border:#e2e8f0;
  --danger:#ef4444;
  --shadow:0 4px 12px rgba(0,0,0,0.08);
  --sea-blue:#0077aa;
  --sea-light:#e0f7ff;
  --sea-border:#d4edf7;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;}
body{background:linear-gradient(135deg, #e0f7ff, #b3ecff);color:var(--text);padding:12px;max-width:820px;margin:0 auto;}
h1{text-align:center;margin:16px 0;font-size:22px;color:var(--sea-blue);}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
.tab-btn{flex-shrink:0;padding:10px 12px;border:none;border-radius:10px;background:#e2e8f0;color:var(--text);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;}
.tab-btn.active{background:var(--primary);color:white;}
.tab-panel{display:none;background:var(--card);padding:16px;border-radius:14px;box-shadow:var(--shadow);}
.tab-panel.show{display:block;}
.section{margin-bottom:14px;}
label{display:block;margin:8px 0 4px;font-weight:500;font-size:14px;}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btn{padding:10px 14px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px;margin:4px 2px;}
.btn-primary{background:var(--primary);color:white;}
.btn-danger{background:var(--danger);color:white;}
.btn-copy{background:#06b6d4;color:white;width:100%;padding:12px;font-size:15px;}
.timeline-item{padding:12px;border-left:3px solid var(--primary);background:#f0f7ff;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.day-title{font-weight:700;margin:10px 0 4px;color:var(--primary);}

/* === สไตล์ส่วนค่าใช้จ่าย === */
.section-inner{background:#f8fcff;padding:18px;border-radius:14px;margin-bottom:18px;border:1px solid var(--sea-border);}
.section-inner h2{font-size:17px;margin-bottom:12px;color:#005577;}
.row-flex{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center;}
.row-flex input, .row-flex select{flex:1;min-width:110px;}
.btn-blue{background:#0099cc;color:white;}
.btn-green{background:#22bb77;color:white;}
.btn-orange{background:#ff9922;color:white;}
.btn-red{background:#ee4444;color:white;padding:6px 10px;font-size:13px;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
th, td{padding:9px;border-bottom:1px solid #cce7f2;text-align:left;font-size:14px;}
th{background:#e6f6fc;}
.result-box{background:#fffef0;border:1px solid #ffe899;border-radius:14px;padding:18px;margin-top:12px;white-space:pre-wrap;font-size:14px;}
.name-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
</style>
</head>
<body>
<h1>Trip Planner & Expense Splitter</h1>

<div class="tabs">
  <button class="tab-btn active" data-tab="itinerary">📅 แผนเดินทาง</button>
  <button class="tab-btn" data-tab="expense">💰 ค่าใช้จ่าย</button>
</div>

<!-- แท็บ 1 : แผนเดินทาง -->
<div id="itinerary" class="tab-panel show">
  <div class="section">
    <h3>เพิ่มกิจกรรมตามไทม์ไลน์</h3>
    <label>เลือกวันที่</label>
    <input type="date" id="actDate">
    <div class="time-row">
      <div>
        <label>ชั่วโมง</label>
        <select id="actHour"></select>
      </div>
      <div>
        <label>นาที</label>
        <select id="actMin"></select>
      </div>
    </div>
    <label>รายละเอียดกิจกรรม</label>
    <input id="actTitle" placeholder="กินข้าวเที่ยง / ไปชมวิว">
    <button class="btn btn-primary" onclick="addActivity()">เพิ่มกิจกรรม</button>
    <div id="itineraryTimeline"></div>
  </div>

  <div class="section">
    <h3>สรุปแผนสำหรับส่ง</h3>
    <textarea id="finalSummary" readonly placeholder="ข้อความสรุปแผนทริป"></textarea>
    <button class="btn btn-copy" onclick="copyToLine()">คัดลอก</button>
    <p id="copyMsg" style="color:var(--secondary);text-align:center;margin-top:8px;"></p>
  </div>
</div>

<!-- แท็บ 2 : ค่าใช้จ่าย -->
<div id="expense" class="tab-panel">
  <div class="section-inner">
    <h2>ตั้งค่าจำนวนคนในทริป</h2>
    <div class="row-flex">
      <input type="number" id="totalPeopleInput" min="2" max="99" value="10" placeholder="จำนวนคนทั้งหมด">
      <button class="btn btn-blue" onclick="updatePeopleCount()">✅ ยีนยันจำนวนคน</button>
    </div>
    <div class="name-grid" id="nameListBox"></div>
  </div>

  <div class="section-inner">
    <h2>บันทึกรายการสำรองจ่าย</h2>
    <div class="row-flex">
      <input type="text" id="expenseName" placeholder="ชื่อรายการ เช่น ค่าพูลวิลล่า">
      <input type="number" id="expenseAmt" placeholder="จำนวนเงิน" min="0" step="0.01">
      <select id="payerSelect"></select>
      <button class="btn btn-blue" onclick="addExpense()">เพิ่มรายการ</button>
    </div>
    <table>
      <thead><tr><th>รายการ</th><th>จำนวนเงิน</th><th>สำรองโดย</th><th>ลบ</th></tr></thead>
      <tbody id="expenseTable"></tbody>
    </table>
  </div>

  <div class="section-inner">
    <h2>คำนวณ & ใบเสร็จสรุป</h2>
    <button class="btn btn-green" onclick="calculateBill()">คำนวณยอดและออกใบเสร็จ</button>
    <div class="result-box" id="receiptBox"></div>
    <button class="btn btn-orange" onclick="copyReceiptToLine()" style="margin-top:12px;">คัดลอกข้อความส่ง</button>
  </div>
</div>

<script>
// ========== ส่วนแผนเดินทาง ==========
let activities = JSON.parse(localStorage.getItem("tripAct")) || [];

function initTimeSelect(){
  const hourSel = document.getElementById("actHour");
  const minSel = document.getElementById("actMin");
  for(let h=0;h<=23;h++){
    const opt = document.createElement("option");
    opt.value = String(h).padStart(2,"0");
    opt.textContent = String(h).padStart(2,"0");
    hourSel.appendChild(opt);
  }
  for(let m=0;m<=55;m+=5){
    const opt = document.createElement("option");
    opt.value = String(m).padStart(2,"0");
    opt.textContent = String(m).padStart(2,"0");
    minSel.appendChild(opt);
  }
  const now = new Date();
  document.getElementById("actDate").valueAsDate = now;
  hourSel.value = String(now.getHours()).padStart(2,"0");
  const minRounded = Math.floor(now.getMinutes()/5)*5;
  minSel.value = String(minRounded).padStart(2,"0");
}

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("show"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("show");
  }
})

function saveData(){
  localStorage.setItem("tripAct",JSON.stringify(activities));
}

function addActivity(){
  const date = document.getElementById("actDate").value;
  const hour = document.getElementById("actHour").value;
  const min = document.getElementById("actMin").value;
  const title = document.getElementById("actTitle").value.trim();
  if(!date || !title) return alert("กรุณาเลือกวันที่ + กรอกกิจกรรม");
  const timeStr = `${hour}:${min}`;
  activities.push({date,time:timeStr,title,id:Date.now()});
  saveData();renderItinerary();
  document.getElementById("actTitle").value="";
}

function renderItinerary(){
  const sorted = [...activities].sort((a,b)=>{
    if(a.date !== b.date) return new Date(a.date)-new Date(b.date);
    const [aH,aM] = a.time.split(":").map(Number);
    const [bH,bM] = b.time.split(":").map(Number);
    return (aH*60+aM)-(bH*60+bM);
  });
  let html="";let prevDate="";
  sorted.forEach(a=>{
    if(a.date!==prevDate){
      html+=`<div class="day-title"> ${formatThaiDate(a.date)}</div>`;
      prevDate=a.date;
    }
    html+=`<div class="timeline-item">
      <div><strong>${a.time}</strong> - ${a.title}</div>
      <button class="btn btn-danger" onclick="delAct(${a.id})">ลบ</button>
    </div>`;
  })
  document.getElementById("itineraryTimeline").innerHTML=html || "<p>ยังไม่มีแผนกิจกรรม</p>";
}

function formatThaiDate(isoDate){
  const d = new Date(isoDate + "T00:00:00");
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
}

function delAct(id){activities=activities.filter(a=>a.id!==id);saveData();renderItinerary();}

function buildSummaryText(){
  const sortedAct = [...activities].sort((a,b)=>{
    if(a.date !== b.date) return new Date(a.date)-new Date(b.date);
    const [aH,aM] = a.time.split(":").map(Number);
    const [bH,bM] = b.time.split(":").map(Number);
    return (aH*60+aM)-(bH*60+bM);
  });
  let itinText="🌴 สรุปแผนการเดินทางทริป\n";
  let lastDate="";
  sortedAct.forEach(a=>{
    if(a.date!==lastDate){itinText+=`\n ${formatThaiDate(a.date)}\n`;lastDate=a.date;}
    itinText+=`  ${a.time} - ${a.title}\n`;
  })
  return itinText;
}

function copyToLine(){
  const summary = buildSummaryText();
  document.getElementById("finalSummary").value = summary;
  navigator.clipboard.writeText(summary).then(()=>{
    document.getElementById("copyMsg").innerText="คัดลอกสำเร็จ!";
    setTimeout(()=>document.getElementById("copyMsg").innerText="",3000);
  })
}

// ========== ส่วนค่าใช้จ่าย ==========
let names = [];
let expenses = [];
window.receiptCopyText = "";

function updatePeopleCount(){
  const count = parseInt(document.getElementById("totalPeopleInput").value);
  if(isNaN(count) || count < 2 || count > 99){
    alert("กรอกจำนวนคนระหว่าง 2‑99 คน"); return;
  }
  const oldNames = [...names];
  names = [];
  for(let i=0; i<count; i++){
    if(oldNames[i]) names.push(oldNames[i]);
    else names.push(`คนที่ ${i+1}`);
  }
  renderNameInputs();
}

function renderNameInputs(){
  const box = document.getElementById("nameListBox");
  box.innerHTML = "";
  for(let i=0;i<names.length;i++){
    const inp = document.createElement("input");
    inp.type="text";
    inp.value = names[i];
    inp.oninput = (e)=> {
      names[i] = e.target.value.trim() || `คนที่${i+1}`;
      renderPayerDropdown();
    };
    box.appendChild(inp);
  }
  renderPayerDropdown();
}

function renderPayerDropdown(){
  const sel = document.getElementById("payerSelect");
  sel.innerHTML = "";
  names.forEach(n=>{
    const opt = document.createElement("option");
    opt.value = n;
    opt.innerText = n;
    sel.appendChild(opt);
  })
}

function addExpense(){
  const itemName = document.getElementById("expenseName").value.trim();
  const amt = parseFloat(document.getElementById("expenseAmt").value);
  const payer = document.getElementById("payerSelect").value;
  if(!itemName || isNaN(amt) || amt<=0){
    alert("กรอกข้อมูลรายการ / จำนวนเงินให้ครบ"); return;
  }
  expenses.push({name:itemName, amount:amt, payer:payer});
  document.getElementById("expenseName").value="";
  document.getElementById("expenseAmt").value="";
  renderExpenseTable();
}

function renderExpenseTable(){
  const tb = document.getElementById("expenseTable");
  tb.innerHTML="";
  expenses.forEach((e,idx)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${e.name}</td><td>${e.amount.toFixed(2)}</td><td>${e.payer}</td><td><button class="btn-red" onclick="delExpense(${idx})">ลบ</button></td>`;
    tb.appendChild(tr);
  })
}
function delExpense(i){ expenses.splice(i,1); renderExpenseTable(); }

function calculateBill(){
  const totalPeople = names.length;
  const totalAll = expenses.reduce((sum,item)=> sum + item.amount,0);
  if(totalAll <= 0){
    alert("ยังไม่มีรายการค่าใช้จ่าย");
    return;
  }
  const perPerson = totalAll / totalPeople;

  let paidMap = {};
  names.forEach(n=> paidMap[n]=0);
  expenses.forEach(e=> {
    if(typeof paidMap[e.payer] !== "undefined"){
      paidMap[e.payer] += e.amount;
    }
  });

  let balances = [];
  names.forEach(n=>{
    const bal = paidMap[n] - perPerson;
    balances.push({name:n, balance:bal});
  })

  let debtors = balances.filter(x=>x.balance < -0.01).map(x=>({...x, owe: -x.balance}));
  let creditors = balances.filter(x=>x.balance > 0.01).map(x=>({...x, receive:x.balance}));
  let settlements = [];

  debtors.sort((a,b)=>b.owe - a.owe);
  creditors.sort((a,b)=>b.receive - a.receive);
  let dIdx=0, cIdx=0;
  while(dIdx<debtors.length && cIdx<creditors.length){
    const amt = Math.min(debtors[dIdx].owe, creditors[cIdx].receive);
    if(amt>0.01){
      settlements.push({
        from: debtors[dIdx].name,
        to: creditors[cIdx].name,
        amount: amt
      })
    }
    debtors[dIdx].owe -= amt;
    creditors[cIdx].receive -= amt;
    if(debtors[dIdx].owe <0.01) dIdx++;
    if(creditors[cIdx].receive <0.01) cIdx++;
  }

  let receiptText = `ใบเสร็จสรุปทริป (ทั้งหมด ${totalPeople} คน)
━━━━━━━━━━━━━━━━━━━━
✅ ยอดรวมทั้งหมด: ${totalAll.toFixed(2)} บาท
✅ เฉลี่ยต่อคน: ${perPerson.toFixed(2)} บาท

📋 รายการค่าใช้จ่าย:
`;
  expenses.forEach(e=> receiptText += `• ${e.name}: ${e.amount.toFixed(2)} บาท (จ่ายโดย ${e.payer})\n`);

  receiptText += `
💵 ยอดสำรองจ่ายแต่ละคน:
`;
  names.forEach(n=> receiptText += `- ${n}: สำรอง ${paidMap[n].toFixed(2)} บาท\n`);

  receiptText += `
🤝 รายการชำระหนี้:
`;
  if(settlements.length===0) receiptText += `✅ ทุกคนสมดุล ไม่ต้องโอนเงินเพิ่ม\n`;
  else settlements.forEach(s=> receiptText += `👉 ${s.from} โอนให้ ${s.to} จำนวน ${s.amount.toFixed(2)} บาท\n`);

  document.getElementById("receiptBox").innerText = receiptText;
  window.receiptCopyText = receiptText;
}

async function copyReceiptToLine(){
  if(!window.receiptCopyText) { alert("กรอกข้อมูลแล้วกดคำนวณก่อน"); return; }
  try{
    await navigator.clipboard.writeText(window.receiptCopyText);
    alert("✅ คัดลอกสำเร็จ!");
  }catch(err){
    prompt("คัดลอกข้อความด้านล่างเอง:", window.receiptCopyText);
  }
}

// === เริ่มทำงาน ===
initTimeSelect();
renderItinerary();
updatePeopleCount();
</script>
</body>
</html>
